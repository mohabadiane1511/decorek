name: decorek

# Fichier de base, valable en production : AUCUN service ne publie de port.
# Les services se joignent entre eux par leur nom sur le réseau interne.
# Pour le développement local, voir docker-compose.dev.yml et `npm run infra:up`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, copier .env.example en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # Le cache est reconstructible : mieux vaut évincer les clés froides que refuser
      # les écritures une fois la mémoire pleine.
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # Persisté pour qu'un redémarrage ne déconnecte pas tout le monde (les sessions
      # vivent ici), mais hors stratégie de sauvegarde : rien d'irremplaçable.
      - cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Stockage des images, compatible S3. RustFS a remplacé MinIO, qui ne publie plus
  # d'images Docker. Les variables du .env gardent leur nom MINIO_* pour ne pas avoir
  # à retoucher les .env existants ; seuls les noms lus par le conteneur changent.
  # Version figée : une mise à jour du stockage se décide, elle ne doit jamais
  # arriver par un simple `pull`.
  storage:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # La console d'administration reste éteinte hors du poste de développement.
      RUSTFS_CONSOLE_ENABLE: "false"
      # Le navigateur téléverse directement ici, depuis le domaine du site : sans cette
      # autorisation d'origine, chaque envoi serait bloqué. Restreint au site, jamais *.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${AUTH_URL:-http://localhost:8080}
      # Vide : les journaux partent sur la sortie standard, lisibles par
      # `docker compose logs storage` comme ceux des autres services.
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      # Volume distinct de celui de MinIO (storage-data), laissé intact sur les serveurs
      # migrés : c'est lui qui permet de revenir en arrière. Voir scripts/migrer-stockage.sh.
      - storage-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Crée le bucket et rend ses images lisibles par tous (elles sont servies au
  # navigateur via /media). Se termine aussitôt : ce n'est pas un service permanent.
  # Relançable sans risque : un bucket existant est conservé tel quel.
  storage-init:
    image: amazon/aws-cli:2.24.0
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      # Surchargé par scripts/migrer-stockage.sh pour préparer un stockage temporaire.
      AWS_ENDPOINT_URL: http://storage:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-decorek-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        aws s3api head-bucket --bucket "$$MINIO_BUCKET" 2>/dev/null \
          || aws s3api create-bucket --bucket "$$MINIO_BUCKET" >/dev/null
        # Lecture des images uniquement. Lister le contenu du bucket reste refusé :
        # personne n'a à parcourir le catalogue des fichiers depuis /media/.
        aws s3api put-bucket-policy --bucket "$$MINIO_BUCKET" --policy "{
          \"Version\": \"2012-10-17\",
          \"Statement\": [{
            \"Effect\": \"Allow\",
            \"Principal\": {\"AWS\": [\"*\"]},
            \"Action\": [\"s3:GetObject\"],
            \"Resource\": [\"arn:aws:s3:::$$MINIO_BUCKET/*\"]
          }]
        }"
        echo "bucket $$MINIO_BUCKET prêt"

  # Boîte aux lettres de développement : capture tous les envois et les affiche dans une
  # interface web, sans jamais rien expédier. Indispensable pour éprouver les e-mails
  # sans risquer d'écrire à de vrais clients depuis un poste de travail.
  #
  # En production, ce service n'est pas démarré : les variables SMTP_* pointent alors
  # vers un vrai serveur (Gmail ou autre).
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    build:
      # Racine du dépôt : la compilation a besoin de src/data/types.ts, le contrat
      # partagé avec le front. Voir l'en-tête de backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      mail:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dans le réseau interne, les services se joignent par leur nom sur leurs ports
      # standards : les ports décalés du poste de développement n'existent pas ici.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant — openssl rand -base64 32}
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      # En développement, Mailpit ; en production, remplacer par le serveur du
      # fournisseur (Gmail : smtp.gmail.com, port 465, SMTP_SECURE=true).
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Deco'Rek <contact@deco-rek.com>}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-decorek-media}
      # Adresse que le navigateur peut joindre : les URL de téléversement sont
      # signées pour celle-ci, pas pour le nom interne du service.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
      MEDIA_PREFIX: /media
    healthcheck:
      # Interroge la route qui vérifie réellement la base, pas un simple ping TCP.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inscrite dans le JavaScript à la construction : changer de domaine impose de
        # reconstruire l'image, pas seulement de redémarrer le conteneur.
        VITE_SITE_URL: ${SITE_URL:-https://deco-rek.com}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Le rendu serveur interroge l'API par son nom de service, sur le réseau interne :
      # « /api/… » n'a pas de sens hors d'un navigateur, et la page partirait vide.
      API_ORIGINE: http://api:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db-data:
  cache-data:
  storage-rustfs-data:
