name: decorek

# Fichier de base, valable en production : AUCUN service ne publie de port.
# Les services se joignent entre eux par leur nom sur le réseau interne.
# Pour le développement local, voir docker-compose.dev.yml et `npm run infra:up`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, copier .env.example en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # Le cache est reconstructible : mieux vaut évincer les clés froides que refuser
      # les écritures une fois la mémoire pleine.
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      # Persisté pour qu'un redémarrage ne déconnecte pas tout le monde (les sessions
      # vivent ici), mais hors stratégie de sauvegarde : rien d'irremplaçable.
      - cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
      # Le navigateur téléverse directement ici, depuis le domaine du site : sans cette
      # autorisation d'origine, chaque envoi serait bloqué. Restreint au site, jamais *.
      MINIO_API_CORS_ALLOW_ORIGIN: ${AUTH_URL:-http://localhost:8080}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Crée le bucket et le rend lisible publiquement (les images produits sont servies
  # au navigateur via /media). Se termine aussitôt : ce n'est pas un service permanent.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-decorek-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
        echo "bucket $$MINIO_BUCKET prêt"

  # Boîte aux lettres de développement : capture tous les envois et les affiche dans une
  # interface web, sans jamais rien expédier. Indispensable pour éprouver les e-mails
  # sans risquer d'écrire à de vrais clients depuis un poste de travail.
  #
  # En production, ce service n'est pas démarré : les variables SMTP_* pointent alors
  # vers un vrai serveur (Gmail ou autre).
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  api:
    build:
      # Racine du dépôt : la compilation a besoin de src/data/types.ts, le contrat
      # partagé avec le front. Voir l'en-tête de backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      mail:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dans le réseau interne, les services se joignent par leur nom sur leurs ports
      # standards : les ports décalés du poste de développement n'existent pas ici.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant — openssl rand -base64 32}
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      # En développement, Mailpit ; en production, remplacer par le serveur du
      # fournisseur (Gmail : smtp.gmail.com, port 465, SMTP_SECURE=true).
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Deco'Rek <contact@decorek.sn>}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-decorek-media}
      # Adresse que le navigateur peut joindre : les URL de téléversement sont
      # signées pour celle-ci, pas pour le nom interne du service.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:59000}
      MEDIA_PREFIX: /media
    healthcheck:
      # Interroge la route qui vérifie réellement la base, pas un simple ping TCP.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db-data:
  cache-data:
  storage-data:
