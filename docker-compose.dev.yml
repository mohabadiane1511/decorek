# Développement local UNIQUEMENT. Ne jamais déployer avec ce fichier.
#
# L'API tournera sur la machine hôte avant d'être conteneurisée (lot 18) : elle a donc
# besoin d'atteindre ces services. Les ports sont liés explicitement à 127.0.0.1, jamais
# à 0.0.0.0 — sans quoi Docker écrit des règles iptables qui court-circuitent le pare-feu
# de l'hôte et publient la base sur Internet, même avec un UFW qui l'affiche fermée.
#
# Les ports côté hôte sont décalés par défaut pour ne pas entrer en conflit avec un
# PostgreSQL, un Redis ou un php-fpm déjà installés sur la machine. Surchargeables
# dans .env. Côté conteneur, les ports restent standards.
#
# Ce fichier n'est pas chargé automatiquement : `docker compose up` seul reste sûr.
# Utiliser `npm run infra:up`.

services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"

  cache:
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"

  storage:
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000" # API S3
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001" # console web

  api:
    ports:
      - "127.0.0.1:${API_PORT:-53000}:3000"

  mail:
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-58025}:8025" # interface web de consultation
      - "127.0.0.1:${MAIL_SMTP_PORT:-51025}:1025" # SMTP

  # Seconde instance de l'API, réservée aux tests de bout en bout.
  #
  # Elle partage l'image et la configuration, mais pointe sur la base « decorek_test ».
  # Sans elle, les tests écrivent dans la base de travail : les commandes qu'ils passent
  # se mêlent aux vraies, et le stock qu'ils consomment est le vrai stock.
  #
  # Le cache utilise l'index 2 de Redis, distinct de celui du développement (0) et de
  # celui des tests d'API (1).
  api-e2e:
    extends:
      file: docker-compose.yml
      service: api
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      mail:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/decorek_test?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379/2
      # Le front de test tourne sur son propre port. Better Auth vérifie l'origine des
      # requêtes et renvoie 403 si elle ne correspond pas à cette adresse.
      AUTH_URL: http://localhost:${E2E_FRONT_PORT:-8090}
      # La suite de tests émet beaucoup de connexions depuis une seule adresse.
      # Le plafond réel reste vérifié par les tests d'API, qui le déclenchent.
      AUTH_RATE_MAX: 500
    ports:
      - "127.0.0.1:${API_E2E_PORT:-53001}:3000"
