# Mise en production derrière Traefik.
#
# À lancer avec le fichier de base, sans celui de développement :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Le fichier de base n'ouvre aucun port : base de données, cache, stockage et
# messagerie restent invisibles depuis Internet et ne se joignent que par le réseau
# interne. Seul Traefik est exposé, et il ne voit que ce qui porte une étiquette.
#
# Le Traefik du VPS tourne en mode réseau « host » : il partage la pile réseau de la
# machine et joint les conteneurs par leur adresse interne, sans réseau partagé. Rien à
# créer ni à raccorder donc — il suffit de lui désigner le réseau du projet, faute de
# quoi il devrait deviner lequel utiliser.
#
# Il n'expose que ce qui porte `traefik.enable=true` (exposedbydefault=false), et
# redirige déjà le port 80 vers le 443 : inutile de le refaire ici.
#
# Les noms d'entrée et de résolveur restent des variables : une étiquette qui nomme une
# entrée inexistante est ignorée en silence, et le site resterait injoignable sans
# qu'aucune erreur ne le dise.

services:
  site:
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_RESEAU:-decorek_default}

      # Le site répond à tout ce que les autres routeurs n'ont pas pris. Sa priorité
      # basse le place après eux : sans cela il capterait aussi /api.
      traefik.http.routers.decorek-site.rule: Host(`${SITE_DOMAINE:-deco-rek.com}`)
      traefik.http.routers.decorek-site.priority: "1"
      traefik.http.routers.decorek-site.entrypoints: ${TRAEFIK_ENTREE:-websecure}
      traefik.http.routers.decorek-site.tls.certresolver: ${TRAEFIK_RESOLVEUR:-letsencrypt}
      traefik.http.routers.decorek-site.middlewares: decorek-securite
      traefik.http.services.decorek-site.loadbalancer.server.port: "3000"

      # En-têtes de sécurité, posés une fois et réutilisés par les autres routeurs.
      # Le navigateur ne devine pas le type d'un fichier, la page ne s'affiche pas dans
      # un cadre étranger, et le référent ne fuite pas vers les sites tiers.
      traefik.http.middlewares.decorek-securite.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.decorek-securite.headers.frameDeny: "true"
      traefik.http.middlewares.decorek-securite.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.decorek-securite.headers.stsSeconds: "31536000"
      traefik.http.middlewares.decorek-securite.headers.stsIncludeSubdomains: "true"

  api:
    # Les dépendances se cumulent d'un fichier à l'autre : « !reset » efface celles du
    # fichier de base avant de reposer les bonnes, sans la messagerie de développement.
    # Les dépendances se cumulent d'un fichier à l'autre : « !override » remplace la
    # liste du fichier de base au lieu de s'y ajouter, ce qui écarte la messagerie de
    # développement sans la laisser bloquer le démarrage.
    depends_on: !override
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      # Adresse publique : les liens des e-mails et les URL signées du stockage
      # partent d'ici, jamais d'un nom de conteneur que personne ne peut joindre.
      AUTH_URL: https://${SITE_DOMAINE:-deco-rek.com}
      SITE_URL: https://${SITE_DOMAINE:-deco-rek.com}
      S3_PUBLIC_ENDPOINT: https://${SITE_DOMAINE:-deco-rek.com}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_RESEAU:-decorek_default}

      # L'API et le plan du site passent avant la règle générale du site.
      traefik.http.routers.decorek-api.rule: Host(`${SITE_DOMAINE:-deco-rek.com}`) && (PathPrefix(`/api`) || Path(`/sitemap.xml`))
      traefik.http.routers.decorek-api.priority: "10"
      traefik.http.routers.decorek-api.entrypoints: ${TRAEFIK_ENTREE:-websecure}
      traefik.http.routers.decorek-api.tls.certresolver: ${TRAEFIK_RESOLVEUR:-letsencrypt}
      traefik.http.routers.decorek-api.middlewares: decorek-securite
      traefik.http.services.decorek-api.loadbalancer.server.port: "3000"

  storage:
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_RESEAU:-decorek_default}

      # Les images sont servies sous /media, jamais depuis l'adresse du stockage :
      # celle-ci resterait à ouvrir sur Internet, avec sa console d'administration.
      traefik.http.routers.decorek-media.rule: Host(`${SITE_DOMAINE:-deco-rek.com}`) && PathPrefix(`/media`)
      traefik.http.routers.decorek-media.priority: "10"
      traefik.http.routers.decorek-media.entrypoints: ${TRAEFIK_ENTREE:-websecure}
      traefik.http.routers.decorek-media.tls.certresolver: ${TRAEFIK_RESOLVEUR:-letsencrypt}
      traefik.http.routers.decorek-media.middlewares: decorek-media-chemin,decorek-securite
      traefik.http.services.decorek-media.loadbalancer.server.port: "9000"

      # /media/photo.jpg devient /decorek-media/photo.jpg : le seau n'apparaît pas dans
      # les adresses publiques, et en changer ne casse aucun lien déjà partagé.
      traefik.http.middlewares.decorek-media-chemin.replacepathregex.regex: ^/media/(.*)
      traefik.http.middlewares.decorek-media-chemin.replacepathregex.replacement: /${MINIO_BUCKET:-decorek-media}/$$1

  # La messagerie de développement n'a rien à faire en production : les e-mails partent
  # par le fournisseur configuré dans .env.
  mail:
    profiles: [developpement]

  # Commandes d'exploitation : appliquer les migrations, installer le catalogue de
  # départ, promouvoir un compte en administrateur.
  #
  # Elles s'appuient sur l'étape de construction de l'image, qui contient le code source
  # et les outils de développement. L'image finale, elle, en est volontairement dépourvue
  # — elle n'a qu'à servir le site, et tout ce qu'on y ajoute est une surface de plus.
  #
  # Ce service ne démarre jamais tout seul : son profil le réserve à un appel explicite.
  #
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     run --rm outils npm run db:seed
  outils:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    profiles: [outils]
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      AUTH_SECRET: ${AUTH_SECRET}
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-decorek-media}
      S3_PUBLIC_ENDPOINT: https://${SITE_DOMAINE:-deco-rek.com}
      MEDIA_PREFIX: /media
    command: ["true"]
